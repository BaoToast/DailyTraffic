<style>
:root{
  color-scheme:light;
  --bg:#eef1f8;--card:#ffffff;--card2:#f7f9fd;--line:#dbe2f0;--text:#1a2233;--muted:#67728c;
  --player:#1b6fd6;--monster:#d23a54;--boss:#a6551f;
  --accent:#176fd4;--accent-text:#fff;--danger:#d1495b;--danger-text:#fff;--good:#28966b;--good-text:#fff;
  --chip-bg:#eef2fb;--chip-border:#cdd8ef;
  --track-bg:#e7ebf5;--buff-bg:#e2f6ea;--buff-border:#3f9c65;--buff-text:#1f7a45;
  --debuff-bg:#fdecee;--debuff-border:#d9505f;--debuff-text:#b23349;
  --shadow:0 8px 22px rgba(30,42,70,.10);--tabbar-bg:#ffffff;--fab-bg:#176fd4;--fab-text:#fff;
  --squad:#7c5cd6;--attr:#4c78a4;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1420;--card:#161f30;--card2:#111a29;--line:#2b3a54;--text:#eaf1ff;--muted:#95a3bf;
  --player:#4faaff;--monster:#ff5b74;--boss:#e8a45c;
  --accent:#2a86e6;--accent-text:#04101f;--danger:#8a2f3f;--danger-text:#fff;--good:#215c43;--good-text:#fff;
  --chip-bg:#1c2942;--chip-border:#33456b;
  --track-bg:#0b1220;--buff-bg:#123423;--buff-border:#3f9c65;--buff-text:#8df2b4;
  --debuff-bg:#3a1c22;--debuff-border:#aa5260;--debuff-text:#ffabb4;
  --shadow:0 10px 26px rgba(2,6,14,.5);--tabbar-bg:#111a29;--fab-bg:#2a86e6;--fab-text:#04101f;
  --squad:#a98cff;--attr:#5c8fc4;
}
[data-theme="contrast"]{
  color-scheme:dark;
  --bg:#000;--card:#000;--card2:#0a0a0a;--line:#fff;--text:#fff;--muted:#ffd400;
  --player:#00e5ff;--monster:#ff3b3b;--boss:#ffd400;
  --accent:#ffd400;--accent-text:#000;--danger:#ff3b3b;--danger-text:#000;--good:#00e676;--good-text:#000;
  --chip-bg:#111;--chip-border:#fff;
  --track-bg:#1a1a1a;--buff-bg:#00230f;--buff-border:#00e676;--buff-text:#5cffb0;
  --debuff-bg:#330000;--debuff-border:#ff3b3b;--debuff-text:#ff8a8a;
  --shadow:0 0 0 2px #fff;--tabbar-bg:#000;--fab-bg:#ffd400;--fab-text:#000;
  --squad:#00e5ff;--attr:#00e5ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input,select{font:inherit;color:var(--text)}
button{touch-action:manipulation}
h1,h2,h3{margin:0}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;box-shadow:var(--shadow)}
.topbar-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar-row1 h1{font-size:1.05rem;letter-spacing:.02em}
.icon-btn{background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:10px;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;padding:0}
.topbar-row2{display:flex;align-items:center;gap:8px;margin-top:8px}
.round-counter{display:flex;align-items:center;gap:4px;background:var(--chip-bg);border:1px solid var(--chip-border);
  border-radius:10px;padding:4px 6px;font-size:.85rem;flex-shrink:0}
.round-counter button{width:26px;height:26px;border-radius:7px;border:1px solid var(--chip-border);background:var(--card);cursor:pointer}
.round-counter b{min-width:20px;text-align:center}
.current-turn{flex:1;min-width:0;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.current-turn b{color:var(--text)}
.next-turn-btn{background:var(--accent);color:var(--accent-text);border:none;border-radius:10px;padding:8px 14px;
  font-weight:700;font-size:.85rem;cursor:pointer;flex-shrink:0;white-space:nowrap}

main{max-width:640px;margin:0 auto;padding:12px 12px 24px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* section headers */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.section-head h2{font-size:1rem}
.section-head-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:10px;padding:8px 10px;font-size:.8rem;cursor:pointer;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-text)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--good-text)}
.btn.small{padding:5px 8px;font-size:.72rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

/* filter chips */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:999px;padding:6px 12px;font-size:.78rem;cursor:pointer;color:var(--text)}
.chip.off{opacity:.4}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}

/* initiative */
.init-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.init-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:8px 10px;box-shadow:var(--shadow)}
.init-item.current{outline:2px solid var(--accent);background:var(--card2)}
.init-item.done{opacity:.45}
.init-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.init-item .name{flex:1;min-width:0;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.init-item .hp{font-size:.75rem;color:var(--muted);flex-shrink:0}
.init-item .move{display:flex;gap:2px}
.init-item .move button{width:26px;height:26px;border-radius:6px;border:1px solid var(--chip-border);background:var(--chip-bg);cursor:pointer;font-size:.75rem}
.empty-hint{color:var(--muted);font-size:.85rem;text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:12px}

/* cards */
.card-grid{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);
  border-left:5px solid var(--unit-color,#888)}
.card.turn-ended{opacity:.55}
.card.low{outline:1.5px solid var(--danger)}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-head input.unit-name{flex:1;min-width:0;border:none;background:transparent;font-weight:700;font-size:1rem;padding:2px 0;color:var(--text)}
.card-head input.unit-color{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:.68rem;padding:2px 7px;border-radius:999px;background:var(--chip-bg);border:1px solid var(--chip-border);color:var(--muted)}
.badge.squad{color:var(--squad);border-color:var(--squad)}
.badge.boss{color:var(--boss);border-color:var(--boss);font-weight:700}
.condition{font-size:.7rem;padding:3px 6px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0}
.condition.buff{background:var(--buff-bg);border:1px solid var(--buff-border);color:var(--buff-text)}
.condition.debuff{background:var(--debuff-bg);border:1px solid var(--debuff-border);color:var(--debuff-text)}
.condition button{background:none;border:none;color:inherit;cursor:pointer;font-size:.75rem;padding:0 2px}
.passive-chip{font-size:.7rem;padding:3px 7px;border-radius:8px;background:var(--chip-bg);border:1px solid var(--chip-border);
  display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0}
.attr-chip{font-size:.7rem;padding:3px 6px;border-radius:8px;background:var(--chip-bg);border:1px solid var(--attr,var(--chip-border));
  display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0}
.attr-chip input{width:44px;border:1px solid var(--chip-border);border-radius:5px;padding:1px 3px;font-size:.7rem;background:var(--card)}

.hp-row{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.hp-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--chip-border);background:var(--chip-bg);
  font-size:1.2rem;cursor:pointer;flex-shrink:0;color:var(--text)}
.hp-btn.minus{color:var(--danger)}
.hp-btn.plus{color:var(--good)}
.bar-wrap{flex:1;min-width:0}
.bar{background:var(--track-bg);border-radius:999px;height:14px;overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--unit-color,#4c78a4);transition:width .25s ease}
.bar-label{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:2px}
.hp-amount{width:52px;height:40px;text-align:center;border-radius:10px;border:1px solid var(--chip-border);background:var(--card2);flex-shrink:0}
.hp-inline{display:flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);margin:4px 0}
.hp-inline input{width:56px;border:1px solid var(--chip-border);border-radius:6px;padding:2px 4px;background:var(--card2);text-align:center}

.custom-bar{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.custom-bar .bar-head{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);margin-bottom:3px}
.custom-bar .bar-name{flex:1;font-weight:600;color:var(--text)}
.custom-bar .bar-values{display:flex;align-items:center;gap:2px}
.custom-bar .bar-values input{width:42px;border:1px solid var(--chip-border);border-radius:5px;padding:1px 3px;background:var(--card2);text-align:center}
.custom-bar .bar-delete{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.85rem}

.manage-toggle{width:100%;text-align:center;background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:9px;
  padding:7px;font-size:.75rem;color:var(--muted);cursor:pointer;margin-top:6px}
.manage-panel{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.manage-block-title{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.inline-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inline-form input,.inline-form select{border:1px solid var(--chip-border);border-radius:8px;padding:6px 8px;background:var(--card2);font-size:.8rem}
.inline-form input[type=text],.inline-form input[type=number]{flex:1;min-width:70px}
.inline-form input[type=color]{width:34px;height:34px;padding:0;border-radius:8px}
.saved-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.saved-tag{font-size:.7rem;padding:3px 8px;border-radius:999px;background:var(--chip-bg);border:1px dashed var(--chip-border);cursor:pointer;color:var(--muted)}
.threshold-item{font-size:.72rem;padding:3px 7px;border-radius:8px;background:var(--chip-bg);border:1px solid var(--chip-border);
  display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0}
.threshold-item.trig{background:var(--debuff-bg);border-color:var(--debuff-border);color:var(--debuff-text)}
.manage-footer{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.summary-wrap{overflow-x:auto;margin-bottom:12px;border:1px solid var(--line);border-radius:12px}
table.summary{border-collapse:collapse;width:100%;font-size:.78rem}
table.summary th,table.summary td{padding:6px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
table.summary th{background:var(--card2);color:var(--muted);font-weight:600}
table.summary tr:last-child td{border-bottom:none}
table.summary tr:active{background:var(--card2)}

.add-form-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);margin-bottom:14px}
.add-form-card .inline-form{margin-bottom:8px}
.palette-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.selected{border-color:var(--text)}

/* more tab */
.more-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.more-block h3{font-size:.85rem;margin-bottom:8px;color:var(--muted)}
.theme-row{display:flex;gap:6px}
.theme-row button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--chip-border);background:var(--chip-bg);font-size:.78rem}
.theme-row button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
.save-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;background:var(--card2);border-radius:10px;margin-bottom:6px;font-size:.8rem}
.save-row .meta{flex:1;min-width:0}
.save-row .meta .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-row .meta .d{font-size:.68rem;color:var(--muted)}

/* fab */
.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
  background:var(--fab-bg);color:var(--fab-text);border:none;box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:1.4rem;
  z-index:25;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* bottom tabs */
.bottom-tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar-bg);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bottom-tabs button{flex:1;background:none;border:none;padding:8px 4px 6px;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:.65rem;color:var(--muted);cursor:pointer}
.bottom-tabs button .ic{font-size:1.15rem}
.bottom-tabs button.active{color:var(--accent);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.8rem;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.toast.show{opacity:.95}

@media (min-width:640px){
  .bottom-tabs{max-width:640px;left:50%;transform:translateX(-50%);border-radius:14px 14px 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .fab{right:calc(50% - 320px + 14px)}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-row1">
    <h1>⚔️ 戰鬥追蹤器</h1>
    <button class="icon-btn" id="themeBtn" title="切換主題">🌓</button>
  </div>
  <div class="topbar-row2">
    <div class="round-counter"><span>回合</span><button id="roundMinus">−</button><b id="roundValue">1</b><button id="roundPlus">+</button></div>
    <div class="current-turn" id="currentTurnLabel">尚未開始</div>
    <button class="next-turn-btn" id="nextTurnTop">▶ 下一位</button>
  </div>
</header>

<main>
  <section id="tab-initiative" class="tab-panel">
    <div class="section-head">
      <h2>🎲 先攻順序</h2>
      <div class="section-head-actions">
        <button class="btn small" id="shuffleInitiative">🔀 隨機</button>
        <button class="btn small" id="toggleShuffleMode">🔒 固定順序</button>
        <button class="btn small" id="resetAllTurns">↺ 重置回合</button>
      </div>
    </div>
    <div class="init-list" id="initiativeList"></div>
    <div class="btn-row" style="margin-bottom:14px">
      <button class="btn small" id="undo" disabled>← 復原</button>
      <button class="btn small" id="redo" disabled>重做 →</button>
    </div>
  </section>

  <section id="tab-players" class="tab-panel">
    <div class="section-head">
      <h2>🛡️ 玩家</h2>
      <div class="section-head-actions">
        <button class="btn small danger" id="resetPlayerHpStatus">↺ 重置血量/狀態</button>
      </div>
    </div>
    <div class="chip-row" id="playerFilterBar"></div>
    <div class="summary-wrap" id="playerSummaryWrap"><div id="playerSummary"></div></div>
    <div class="card-grid" id="playerCards"></div>
    <form class="add-form-card" id="addPlayerForm">
      <div class="manage-block-title">新增玩家</div>
      <div class="inline-form">
        <input id="playerName" maxlength="20" required placeholder="名字" type="text">
        <input id="playerMaxHp" type="number" min="1" max="999999" value="100" required placeholder="最大血量">
        <input id="playerColor" type="color" value="#1b6fd6">
      </div>
      <div class="palette-row" id="playerPalette"></div>
      <button class="btn primary" type="submit">＋ 加入玩家</button>
    </form>
  </section>

  <section id="tab-monsters" class="tab-panel">
    <div class="section-head">
      <h2>👹 怪物</h2>
      <div class="section-head-actions">
        <button class="btn small" id="resetMonsterTurns">↺ 重置回合</button>
        <button class="btn small danger" id="clearAllMonsters">🗑️ 清空</button>
      </div>
    </div>
    <div class="chip-row" id="monsterFilterBar"></div>
    <div class="summary-wrap" id="monsterSummaryWrap"><div id="monsterSummary"></div></div>
    <div class="card-grid" id="monsterCards"></div>

    <form class="add-form-card" id="addMonsterForm">
      <div class="manage-block-title">新增怪物 / 頭目</div>
      <div class="inline-form">
        <select id="monsterKind"><option value="monster">怪物</option><option value="boss">頭目</option></select>
        <input id="monsterName" maxlength="20" required placeholder="名字" type="text">
      </div>
      <div class="inline-form">
        <input id="monsterMaxHp" type="number" min="1" max="999999" value="20" required placeholder="最大血量">
        <input id="monsterColor" type="color" value="#d23a54">
      </div>
      <div class="inline-form">
        <label style="display:flex;align-items:center;gap:5px;font-size:.78rem"><input type="checkbox" id="monsterAsSquad"> 建立為小隊</label>
        <input id="monsterSquadCount" type="number" min="2" max="12" value="3" style="width:60px" title="小隊數量">
      </div>
      <div class="palette-row" id="monsterPalette"></div>
      <div class="saved-tags" id="monsterTemplateTags"></div>
      <button class="btn primary" type="submit">＋ 加入怪物</button>
    </form>
  </section>

  <section id="tab-more" class="tab-panel">
    <div class="more-block">
      <h3>外觀主題</h3>
      <div class="theme-row" id="themeSwitch">
        <button data-theme-choice="light">☀️ 明亮</button>
        <button data-theme-choice="dark">🌙 深色</button>
        <button data-theme-choice="contrast">⬛ 高對比</button>
      </div>
    </div>
    <div class="more-block">
      <h3>螢幕與備份</h3>
      <div class="btn-row">
        <button class="btn" id="toggleWakeLock">📱 保持螢幕開啟：關</button>
        <button class="btn" id="btnExportData">💾 匯出備份</button>
        <button class="btn" id="btnImportData">📂 匯入備份</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="more-block">
      <h3>存檔</h3>
      <form class="inline-form" id="saveForm" style="margin-bottom:8px">
        <input id="saveName" maxlength="30" required placeholder="存檔名稱" type="text">
        <button class="btn primary" type="submit">存檔</button>
      </form>
      <div id="saveList"></div>
    </div>
    <div class="more-block">
      <h3>行動標籤（先攻卡）</h3>
      <div class="chip-row" id="actionTags"></div>
      <form class="inline-form" id="tagForm">
        <input id="tagName" maxlength="20" required placeholder="新增行動標籤" type="text">
        <button class="btn" type="submit">新增</button>
      </form>
    </div>
    <div class="more-block">
      <h3>重置</h3>
      <div class="btn-row">
        <button class="btn danger" id="resetPlayerTurns">重置玩家回合</button>
        <button class="btn danger" id="resetTags">重置行動標籤</button>
      </div>
    </div>
  </section>
</main>

<button class="fab" id="floatingNextTurn" title="下一位">▶</button>
<div class="toast" id="toast"></div>

<nav class="bottom-tabs">
  <button data-tab="initiative" class="active"><span class="ic">🎲</span>先攻</button>
  <button data-tab="players"><span class="ic">🛡️</span>玩家</button>
  <button data-tab="monsters"><span class="ic">👹</span>怪物</button>
  <button data-tab="more"><span class="ic">⚙️</span>更多</button>
</nav>

<script>
'use strict';
/* ---------- constants & storage ---------- */
const MAX_TEMPLATES=20,MAX_HISTORY=50;
const defaultPalette=['#1b6fd6','#d23a54','#28966b','#a6551f','#7c5cd6','#d6a51b','#2aa6c9','#5a5f6b'];
const HEX_COLOR_RE=/^#[0-9a-fA-F]{6}$/, SAFE_ID_RE=/^[a-zA-Z0-9-]{1,64}$/;
function uid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800)}
function getMemory(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){return fallback}}
function saveMemory(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){toast('儲存失敗：裝置儲存空間可能已滿')}}
function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escapeAttr(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sanitizeColor(c,fb){return typeof c==='string'&&HEX_COLOR_RE.test(c)?c:fb}
function sanitizeId(id){return typeof id==='string'&&SAFE_ID_RE.test(id)?id:uid()}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function pushWithLimit(arr,item,max){arr.push(item);if(arr.length>max)arr.shift();return arr}

/* ---------- state ---------- */
let units=[];          // players + monsters + bosses, unified
let squads=[];         // {id,name,color}
let actionTags=[];     // {id,name,active}
let statusTemplates=[],attributeTemplates=[],barTemplates=[],passiveTemplates=[],monsterTemplates=[];
let paletteColors=[...defaultPalette];
let initiativeOrder=[]; // array of entry keys: unitId or unitId::N (boss extra cards)
let roundCounter=1, currentTurnId=null, shuffleEachRound=false;
let playerFilter=new Set(), monsterFilter=new Set();
let expandedManageIds=new Set();
let history=[], future=[];
let theme='light';
let wakeLockRef=null;
let activeTab='initiative';

/* ---------- sanitizers ---------- */
function sanitizeStatusList(list){return Array.isArray(list)?list.filter(s=>s&&typeof s.name==='string').map(s=>({id:sanitizeId(s.id),name:String(s.name).slice(0,20),kind:s.kind==='buff'?'buff':'debuff',turns:clamp(Number(s.turns)||1,0,999)})):[]}
function sanitizeAttributeList(list){return Array.isArray(list)?list.filter(a=>a&&typeof a.name==='string').map(a=>({id:sanitizeId(a.id),name:String(a.name).slice(0,20),value:a.value==null?'':String(a.value).slice(0,20),color:sanitizeColor(a.color,'#4c78a4')})):[]}
function sanitizeBarList(list){return Array.isArray(list)?list.filter(b=>b&&typeof b.name==='string').map(b=>({id:sanitizeId(b.id),name:String(b.name).slice(0,20),value:clamp(Number(b.value)||0,0,999999),maxValue:clamp(Number(b.maxValue)||1,1,999999),color:sanitizeColor(b.color,'#7c8db5')})):[]}
function sanitizePassiveList(list){return Array.isArray(list)?list.filter(p=>p&&typeof p.name==='string').map(p=>({id:sanitizeId(p.id),name:String(p.name).slice(0,30),color:sanitizeColor(p.color,''),auto:!!p.auto})):[]}
function sanitizeHpThresholds(list){return Array.isArray(list)?list.slice(0,5).filter(t=>t&&Number.isFinite(Number(t.value))).map(t=>({id:sanitizeId(t.id),value:clamp(Number(t.value)||1,1,999999),passiveName:t.passiveName?String(t.passiveName).slice(0,30):'',autoRemove:!!t.autoRemove,triggered:!!t.triggered})):[]}
function sanitizeUnit(u){
  if(!u||typeof u!=='object')return null;
  const type=u.type==='monster'?'monster':'player';
  const maxHp=clamp(Number(u.maxHp)||1,1,999999);
  return {
    id:sanitizeId(u.id),type,isBoss:type==='monster'&&!!u.isBoss,
    name:typeof u.name==='string'?u.name.slice(0,40):'未命名',
    hp:clamp(Number(u.hp)!=null?Number(u.hp):maxHp,0,maxHp),maxHp,
    color:sanitizeColor(u.color,type==='player'?'#1b6fd6':'#d23a54'),
    squadId:u.squadId?sanitizeId(u.squadId):null,
    turnEnded:!!u.turnEnded,
    bossCardCount:u.isBoss?clamp(Number(u.bossCardCount)||1,1,10):1,
    statuses:sanitizeStatusList(u.statuses),attributes:sanitizeAttributeList(u.attributes),
    bars:sanitizeBarList(u.bars),passives:sanitizePassiveList(u.passives),
    hpThresholds:type==='monster'?sanitizeHpThresholds(u.hpThresholds):[]
  };
}
function sanitizeUnits(list){return Array.isArray(list)?list.map(sanitizeUnit).filter(Boolean):[]}
function sanitizeSquads(list){return Array.isArray(list)?list.filter(s=>s&&typeof s.name==='string').map(s=>({id:sanitizeId(s.id),name:String(s.name).slice(0,20),color:sanitizeColor(s.color,'#7c5cd6')})):[]}
function sanitizeActionTags(list){return Array.isArray(list)?list.filter(t=>t&&typeof t.name==='string').map(t=>({id:sanitizeId(t.id),name:String(t.name).slice(0,20),active:!!t.active})):[]}
function sanitizePalette(list){return Array.isArray(list)?list.filter(c=>typeof c==='string'&&HEX_COLOR_RE.test(c)):[...defaultPalette]}
function sanitizeMonsterTemplates(list){return Array.isArray(list)?list.slice(0,MAX_TEMPLATES).map(t=>({id:sanitizeId(t.id),name:String(t.name||'').slice(0,20),maxHp:clamp(Number(t.maxHp)||1,1,999999),color:sanitizeColor(t.color,'#d23a54'),isBoss:!!t.isBoss,passives:sanitizePassiveList(t.passives),attributes:sanitizeAttributeList(t.attributes),bars:sanitizeBarList(t.bars)})):[]}

/* ---------- history (undo/redo) ---------- */
function snapshot(){return {units,squads,actionTags,statusTemplates,attributeTemplates,barTemplates,passiveTemplates,monsterTemplates,paletteColors,initiativeOrder,roundCounter,currentTurnId,shuffleEachRound}}
function saveHistory(){pushWithLimit(history,JSON.stringify(snapshot()),MAX_HISTORY);future=[];updateUndoRedoButtons()}
function applyState(s){
  units=sanitizeUnits(s.units);squads=sanitizeSquads(s.squads);actionTags=sanitizeActionTags(s.actionTags);
  statusTemplates=sanitizeStatusList(s.statusTemplates);attributeTemplates=sanitizeAttributeList(s.attributeTemplates);
  barTemplates=sanitizeBarList(s.barTemplates);passiveTemplates=sanitizePassiveList(s.passiveTemplates);
  monsterTemplates=sanitizeMonsterTemplates(s.monsterTemplates);paletteColors=sanitizePalette(s.paletteColors);
  initiativeOrder=Array.isArray(s.initiativeOrder)?s.initiativeOrder:[];
  roundCounter=Number.isFinite(s.roundCounter)?s.roundCounter:1;
  currentTurnId=typeof s.currentTurnId==='string'?s.currentTurnId:null;
  shuffleEachRound=!!s.shuffleEachRound;
  syncInitiativeOrder();renderAll();autosave();
}
function undo(){if(!history.length)return;future.push(JSON.stringify(snapshot()));if(future.length>MAX_HISTORY)future.shift();applyState(JSON.parse(history.pop()));updateUndoRedoButtons()}
function redo(){if(!future.length)return;history.push(JSON.stringify(snapshot()));if(history.length>MAX_HISTORY)history.shift();applyState(JSON.parse(future.pop()));updateUndoRedoButtons()}
function updateUndoRedoButtons(){document.getElementById('undo').disabled=!history.length;document.getElementById('redo').disabled=!future.length}

/* ---------- autosave / load ---------- */
function autosave(){saveMemory('bt_state',{units,squads,actionTags,initiativeOrder,roundCounter,currentTurnId,shuffleEachRound,playerFilter:[...playerFilter],monsterFilter:[...monsterFilter],activeTab,theme})}
let autosaveTimer=null;
function scheduleAutosave(){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(autosave,300)}
function loadAll(){
  const s=getMemory('bt_state',null);
  statusTemplates=sanitizeStatusList(getMemory('bt_statusTemplates',[]));
  attributeTemplates=sanitizeAttributeList(getMemory('bt_attributeTemplates',[]));
  barTemplates=sanitizeBarList(getMemory('bt_barTemplates',[]));
  passiveTemplates=sanitizePassiveList(getMemory('bt_passiveTemplates',[]));
  monsterTemplates=sanitizeMonsterTemplates(getMemory('bt_monsterTemplates',[]));
  paletteColors=sanitizePalette(getMemory('bt_palette',[...defaultPalette]));
  theme=['light','dark','contrast'].includes(getMemory('bt_theme',null))?getMemory('bt_theme',null):'light';
  if(s){
    units=sanitizeUnits(s.units);squads=sanitizeSquads(s.squads);actionTags=sanitizeActionTags(s.actionTags);
    initiativeOrder=Array.isArray(s.initiativeOrder)?s.initiativeOrder:[];
    roundCounter=Number.isFinite(s.roundCounter)?s.roundCounter:1;
    currentTurnId=typeof s.currentTurnId==='string'?s.currentTurnId:null;
    shuffleEachRound=!!s.shuffleEachRound;
    playerFilter=new Set(s.playerFilter||[]);monsterFilter=new Set(s.monsterFilter||[]);
    activeTab=['initiative','players','monsters','more'].includes(s.activeTab)?s.activeTab:'initiative';
  }
  syncInitiativeOrder();
}

/* ---------- unit helpers ---------- */
function findUnit(id){return units.find(u=>u.id===id)}
function playersList(){return units.filter(u=>u.type==='player')}
function monstersList(){return units.filter(u=>u.type==='monster')}
function findSquad(id){return squads.find(s=>s.id===id)}
function squadMembers(squadId){return units.filter(u=>u.squadId===squadId)}

function addUnit({type,name,maxHp,color,isBoss,bossCardCount,squadId}){
  const u=sanitizeUnit({id:uid(),type,name,maxHp,hp:maxHp,color,isBoss,bossCardCount,squadId,statuses:[],attributes:[],bars:[],passives:[],hpThresholds:[]});
  units.push(u);
  initiativeOrder.push(u.id);
  if(u.isBoss&&u.bossCardCount>1){for(let i=2;i<=u.bossCardCount;i++)initiativeOrder.push(u.id+'::'+i)}
  return u;
}

/* ---------- initiative ---------- */
function syncInitiativeOrder(){
  const validKeys=new Set();
  units.forEach(u=>{validKeys.add(u.id);if(u.isBoss&&u.bossCardCount>1)for(let i=2;i<=u.bossCardCount;i++)validKeys.add(u.id+'::'+i)});
  initiativeOrder=initiativeOrder.filter(k=>validKeys.has(k));
  validKeys.forEach(k=>{if(!initiativeOrder.includes(k))initiativeOrder.push(k)});
  if(currentTurnId&&!initiativeOrder.includes(currentTurnId))currentTurnId=null;
}
function keyUnit(key){return findUnit(key.split('::')[0])}
function initiativeEntries(){return initiativeOrder.map(key=>({key,unit:keyUnit(key)})).filter(e=>e.unit)}
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function shuffleInitiative(){saveHistory();shuffleArray(initiativeOrder);renderAll();scheduleAutosave()}
function moveInitiative(key,dir){const i=initiativeOrder.indexOf(key);const j=i+dir;if(i<0||j<0||j>=initiativeOrder.length)return;saveHistory();[initiativeOrder[i],initiativeOrder[j]]=[initiativeOrder[j],initiativeOrder[i]];renderAll();scheduleAutosave()}
function nextTurn(){
  const entries=initiativeEntries();
  if(!entries.length){toast('尚無角色可排入先攻順序');return}
  saveHistory();
  let idx=entries.findIndex(e=>e.key===currentTurnId);
  if(idx>=0){entries[idx].unit.turnEnded=true}
  let nextIdx=idx+1;
  if(nextIdx>=entries.length){
    nextIdx=0;
    roundCounter++;
    units.forEach(u=>u.turnEnded=false);
    if(shuffleEachRound)shuffleArray(initiativeOrder);
  }
  const freshEntries=initiativeEntries();
  currentTurnId=freshEntries[nextIdx]?freshEntries[nextIdx].key:null;
  renderAll();scheduleAutosave();
  if(currentTurnId)scrollToCard(keyUnit(currentTurnId).id);
}
function resetAllTurns(){saveHistory();units.forEach(u=>u.turnEnded=false);currentTurnId=null;roundCounter=1;renderAll();scheduleAutosave()}
function resetTypeTurns(type){saveHistory();units.filter(u=>u.type===type).forEach(u=>u.turnEnded=false);renderAll();scheduleAutosave()}
function scrollToCard(id){const el=document.querySelector(`[data-card-id="${id}"]`);if(el){if(activeTab!=='players'&&activeTab!=='monsters'){const u=findUnit(id);setTab(u.type==='player'?'players':'monsters')}setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'})},50)}}

/* ---------- HP thresholds (boss) ---------- */
function checkHpThresholds(unit){
  if(!unit.isBoss)return;
  (unit.hpThresholds||[]).forEach(t=>{
    const below=unit.hp<t.value;
    if(below&&!t.triggered){
      t.triggered=true;
      if(t.passiveName&&!unit.passives.some(p=>p.name===t.passiveName)){unit.passives.push({id:uid(),name:t.passiveName,color:'',auto:true})}
    }else if(!below&&t.triggered&&t.autoRemove){
      t.triggered=false;
      unit.passives=unit.passives.filter(p=>!(p.auto&&p.name===t.passiveName));
    }
  });
}

/* ---------- rendering ---------- */
function setTab(tab){activeTab=tab;document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+tab));document.querySelectorAll('.bottom-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));scheduleAutosave()}

function renderAll(){
  renderInitiative();
  renderUnitsPanel('player');
  renderUnitsPanel('monster');
  renderMore();
  updateUndoRedoButtons();
  updateFloatingNextTurnLabel();
}

function initiativeItemHtml(entry,idx,entries){
  const u=entry.unit;const isBoss=u.isBoss;const card=entry.key.includes('::')?' #'+entry.key.split('::')[1]:(isBoss&&u.bossCardCount>1?' #1':'');
  const current=entry.key===currentTurnId;
  return `<div class="init-item ${current?'current':''} ${u.turnEnded?'done':''}" data-init-key="${escapeAttr(entry.key)}">
    <span class="dot" style="background:${sanitizeColor(u.color,'#888')}"></span>
    <span class="name">${u.isBoss?'👑 ':u.type==='monster'?'👹 ':'🛡️ '}${escapeHtml(u.name)}${card}</span>
    <span class="hp">${u.hp}/${u.maxHp}</span>
    <span class="move">
      <button data-init-move="${escapeAttr(entry.key)}" data-dir="-1" ${idx===0?'disabled':''}>↑</button>
      <button data-init-move="${escapeAttr(entry.key)}" data-dir="1" ${idx===entries.length-1?'disabled':''}>↓</button>
    </span>
  </div>`;
}
function renderInitiative(){
  const entries=initiativeEntries();
  document.getElementById('initiativeList').innerHTML=entries.length?entries.map((e,i)=>initiativeItemHtml(e,i,entries)).join(''):'<div class="empty-hint">目前沒有角色。到「玩家」或「怪物」分頁新增角色後會自動加入先攻順序。</div>';
  document.getElementById('roundValue').textContent=roundCounter;
  const cur=currentTurnId?keyUnit(currentTurnId):null;
  document.getElementById('currentTurnLabel').innerHTML=cur?`目前：<b>${escapeHtml(cur.name)}</b>`:'尚未開始';
  document.getElementById('toggleShuffleMode').textContent=shuffleEachRound?'🔀 每回合重排':'🔒 固定順序';
}
function updateFloatingNextTurnLabel(){/* icon stays constant, could add ripple later */}

function conditionHtml(unit,item){
  return `<span class="condition ${item.kind}" data-unit-id="${unit.id}" data-status-id="${item.id}">${item.kind==='buff'?'▲':'▼'} ${escapeHtml(item.name)} ${item.turns}回合
    <button data-status-turn="-1">−</button><button data-status-turn="1">＋</button><button data-status-delete="1">×</button></span>`;
}
function passiveHtml(unit,item){
  return `<span class="passive-chip" data-unit-id="${unit.id}" data-passive-id="${item.id}">✦ ${escapeHtml(item.name)}<button data-passive-delete="1">×</button></span>`;
}
function attrChipHtml(unit,item){
  return `<span class="attr-chip" data-unit-id="${unit.id}" data-attr-id="${item.id}"><span>${escapeHtml(item.name)}</span>
    <input data-attr-value value="${escapeAttr(item.value)}" placeholder="數值"><button data-attr-delete="1">×</button></span>`;
}
function customBarHtml(unit,bar){
  const pct=bar.maxValue?clamp(Math.round(bar.value/bar.maxValue*100),0,999):0;
  return `<div class="custom-bar" data-unit-id="${unit.id}" data-bar-id="${bar.id}">
    <div class="bar-head"><span class="bar-name">${escapeHtml(bar.name)}</span>
      <span class="bar-values"><input data-bar-value type="number" min="0" value="${bar.value}"> / <input data-bar-max type="number" min="1" value="${bar.maxValue}"></span>
      <button class="bar-delete" data-bar-delete="1">×</button></div>
    <div class="hp-row" style="margin:4px 0">
      <button class="hp-btn minus" data-bar-adjust="-1" style="width:32px;height:32px;font-size:1rem">−</button>
      <div class="bar-wrap"><div class="bar" style="height:10px"><div class="fill" style="width:${pct}%;background:${sanitizeColor(bar.color,'#7c8db5')}"></div></div></div>
      <button class="hp-btn plus" data-bar-adjust="1" style="width:32px;height:32px;font-size:1rem">＋</button>
      <input class="hp-amount" data-bar-amount type="number" min="1" value="1" style="width:40px;height:32px">
    </div></div>`;
}
function thresholdHtml(unit,t){
  return `<span class="threshold-item ${t.triggered?'trig':''}" data-unit-id="${unit.id}" data-threshold-id="${t.id}">
    ${t.triggered?'⚡':'⚠️'} 低於 ${t.value}${t.passiveName?` → ${escapeHtml(t.passiveName)} ${t.autoRemove?'🔁':'🔒'}`:''}
    <button data-threshold-delete="1">×</button></span>`;
}
function savedTagsHtml(unitId,items,addAttr,idAttr){
  return items.map(it=>`<button type="button" class="saved-tag" data-unit-id="${unitId}" data-${addAttr}="${it.id}">${escapeHtml(it.name)}</button>`).join('')||'<span style="font-size:.7rem;color:var(--muted)">尚無常用項目</span>';
}
function miniPaletteHtml(){return paletteColors.map(c=>`<button type="button" class="swatch" data-mini-color="${escapeAttr(c)}" style="width:22px;height:22px;background:${escapeAttr(c)}"></button>`).join('')}

function cardHtml(unit){
  const pct=unit.maxHp?clamp(Math.round(unit.hp/unit.maxHp*100),0,100):0;
  const low=unit.hp>0&&pct<=25;
  const dead=unit.hp<=0;
  const squad=unit.squadId?findSquad(unit.squadId):null;
  const expanded=expandedManageIds.has(unit.id);
  const statuses=(unit.statuses||[]).map(s=>conditionHtml(unit,s)).join('')||'<span style="font-size:.72rem;color:var(--muted)">無狀態</span>';
  const passives=(unit.passives||[]).map(p=>passiveHtml(unit,p)).join('');
  const attrs=(unit.attributes||[]).map(a=>attrChipHtml(unit,a)).join('');
  const bars=(unit.bars||[]).map(b=>customBarHtml(unit,b)).join('');
  const thresholds=unit.isBoss?(unit.hpThresholds||[]).map(t=>thresholdHtml(unit,t)).join('')||'<span style="font-size:.72rem;color:var(--muted)">尚未設定警戒線</span>':'';
  return `<article class="card ${unit.turnEnded?'turn-ended':''} ${low||dead?'low':''}" data-card-id="${unit.id}" style="--unit-color:${sanitizeColor(unit.color,'#888')}">
    <div class="card-head">
      <input class="unit-name" data-unit-name="${unit.id}" value="${escapeAttr(unit.name)}" maxlength="40">
      <input class="unit-color" type="color" data-unit-color="${unit.id}" value="${sanitizeColor(unit.color,'#888')}">
    </div>
    <div class="card-badges">
      ${unit.isBoss?'<span class="badge boss">👑 頭目</span>':''}
      ${squad?`<span class="badge squad">🔗 ${escapeHtml(squad.name)}</span>`:''}
      ${passives}
    </div>
    ${attrs?`<div class="card-badges">${attrs}</div>`:''}
    <div>${statuses}</div>
    <div class="hp-row">
      <button class="hp-btn minus" data-id="${unit.id}" data-action="damage">−</button>
      <div class="bar-wrap"><div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="bar-label"><span>${dead?'倒下':pct+'%'}</span><span>${unit.hp} / ${unit.maxHp}</span></div></div>
      <button class="hp-btn plus" data-id="${unit.id}" data-action="heal">＋</button>
      <input class="hp-amount" data-amount type="number" min="1" step="1" value="1">
    </div>
    ${bars}
    <button type="button" class="manage-toggle" data-manage-toggle="${unit.id}">${expanded?'▲ 收合管理':'▼ 管理狀態・屬性・數值條'}</button>
    <div class="manage-panel ${expanded?'':'hidden'}" data-manage-panel="${unit.id}">
      <div class="hp-inline">
        <span>設定：</span>目前<input type="number" data-hp-current="${unit.id}" min="0" max="${unit.maxHp}" value="${unit.hp}">

function summaryHtml(list){
  if(!list.length)return '<div style="padding:10px;font-size:.8rem;color:var(--muted)">尚無角色</div>';
  const rows=list.map(u=>{
    const pct=u.maxHp?clamp(Math.round(u.hp/u.maxHp*100),0,100):0;
    const st=(u.statuses||[]).map(s=>(s.kind==='buff'?'▲':'▼')+escapeHtml(s.name)+s.turns).join(' ')||'—';
    return `<tr data-summary-jump="${u.id}"><td>${u.isBoss?'👑':u.type==='monster'?'👹':'🛡️'} ${escapeHtml(u.name)}</td><td>${u.hp}/${u.maxHp} (${pct}%)</td><td>${st}</td></tr>`;
  }).join('');
  return `<table class="summary"><thead><tr><th>名稱</th><th>血量</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function filterBarHtml(list,filterSet,type){
  if(!list.length)return '';
  return list.map(u=>`<button type="button" class="chip ${filterSet.size&&!filterSet.has(u.id)?'off':'on'}" data-filter-type="${type}" data-filter-id="${u.id}">${escapeHtml(u.name)}</button>`).join('');
}
function renderUnitsPanel(type){
  const list=units.filter(u=>u.type===type);
  const filterSet=type==='player'?playerFilter:monsterFilter;
  const visible=filterSet.size?list.filter(u=>filterSet.has(u.id)):list;
  document.getElementById(type==='player'?'playerFilterBar':'monsterFilterBar').innerHTML=filterBarHtml(list,filterSet,type);
  document.getElementById(type==='player'?'playerSummary':'monsterSummary').innerHTML=summaryHtml(visible);
  document.getElementById(type==='player'?'playerCards':'monsterCards').innerHTML=visible.length?visible.map(cardHtml).join(''):`<div class="empty-hint">尚未新增${type==='player'?'玩家':'怪物'}，請於下方表單新增。</div>`;
  if(type==='monster'){
    document.getElementById('monsterTemplateTags').innerHTML=monsterTemplates.map(t=>`<button type="button" class="saved-tag" data-monster-template="${t.id}">${escapeHtml(t.name)}</button>`).join('');
  }
}

function renderMore(){
  document.getElementById('actionTags').innerHTML=actionTags.map(t=>`<span style="display:inline-flex;align-items:center;gap:2px"><button type="button" class="chip ${t.active?'on':''}" data-tag-toggle="${t.id}">${escapeHtml(t.name)}</button><button type="button" style="background:none;border:none;color:var(--danger);cursor:pointer" data-tag-delete="${t.id}">×</button></span>`).join('')||'<span style="font-size:.8rem;color:var(--muted)">尚無行動標籤</span>';
  const saves=getMemory('bt_saves',[]);
  document.getElementById('saveList').innerHTML=saves.length?saves.map(sv=>`<div class="save-row"><div class="meta"><div class="t">${escapeHtml(sv.name)}</div><div class="d">${new Date(sv.timestamp).toLocaleString('zh-TW')}</div></div>
    <div class="btn-row"><button class="btn small primary" data-save-load="${sv.id}">載入</button><button class="btn small danger" data-save-delete="${sv.id}">刪除</button></div></div>`).join(''):'<div style="font-size:.8rem;color:var(--muted)">尚無存檔</div>';
  document.querySelectorAll('#themeSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===theme));
}

function renderPalettes(){
  document.getElementById('playerPalette').innerHTML=paletteColors.map(c=>`<button type="button" class="swatch" data-palette-target="player" data-color="${escapeAttr(c)}" style="background:${escapeAttr(c)}"></button>`).join('');

async function requestWakeLock(){try{wakeLockRef=await navigator.wakeLock.request('screen');wakeLockRef.addEventListener('release',()=>{updateWakeLockButton()});updateWakeLockButton()}catch(e){toast('無法保持螢幕開啟（裝置不支援或省電模式）')}}
function releaseWakeLock(){if(wakeLockRef){wakeLockRef.release();wakeLockRef=null}updateWakeLockButton()}

/* ---------- export / import ---------- */
function exportData(){
  const data={version:1,exportedAt:new Date().toISOString(),units,squads,actionTags,statusTemplates,attributeTemplates,barTemplates,passiveTemplates,monsterTemplates,paletteColors,initiativeOrder,roundCounter,currentTurnId,shuffleEachRound,saves:getMemory('bt_saves',[])};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`battle-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('已匯出備份檔');
}
function importDataFromFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      saveHistory();
      units=sanitizeUnits(data.units);squads=sanitizeSquads(data.squads);actionTags=sanitizeActionTags(data.actionTags);
      statusTemplates=sanitizeStatusList(data.statusTemplates);attributeTemplates=sanitizeAttributeList(data.attributeTemplates);
      barTemplates=sanitizeBarList(data.barTemplates);passiveTemplates=sanitizePassiveList(data.passiveTemplates);
      monsterTemplates=sanitizeMonsterTemplates(data.monsterTemplates);paletteColors=sanitizePalette(data.paletteColors);
      initiativeOrder=Array.isArray(data.initiativeOrder)?data.initiativeOrder:[];
      roundCounter=Number.isFinite(data.roundCounter)?data.roundCounter:1;
      currentTurnId=typeof data.currentTurnId==='string'?data.currentTurnId:null;
      shuffleEachRound=!!data.shuffleEachRound;
      if(Array.isArray(data.saves))saveMemory('bt_saves',data.saves);
      persistTemplates();
      syncInitiativeOrder();renderAll();renderPalettes();scheduleAutosave();
      toast('匯入完成');
    }catch(e){toast('匯入失敗：檔案格式不正確')}
  };
  reader.readAsText(file);
}
function persistTemplates(){saveMemory('bt_statusTemplates',statusTemplates);saveMemory('bt_attributeTemplates',attributeTemplates);saveMemory('bt_barTemplates',barTemplates);saveMemory('bt_passiveTemplates',passiveTemplates);saveMemory('bt_monsterTemplates',monsterTemplates);saveMemory('bt_palette',paletteColors)}

/* --- card-level interactions (delegated on document) --- */
document.addEventListener('click',e=>{
  // hp damage/heal
  const hpBtn=e.target.closest('[data-action]');
  if(hpBtn&&(hpBtn.dataset.action==='damage'||hpBtn.dataset.action==='heal')){
    const unit=findUnit(hpBtn.dataset.id);if(!unit)return;
    const card=hpBtn.closest('.card');const amtInput=card.querySelector('[data-amount]');
    const amt=clamp(Number(amtInput.value)||1,1,999999);
    saveHistory();
    unit.hp=clamp(unit.hp+(hpBtn.dataset.action==='heal'?amt:-amt),0,unit.maxHp);
    checkHpThresholds(unit);
    renderUnitsPanel(unit.type);renderInitiative();scheduleAutosave();
    return;
  }
  if(hpBtn&&hpBtn.dataset.action==='delete'){
    const unit=findUnit(hpBtn.dataset.id);if(!unit)return;
    if(!confirm('確定要刪除「'+unit.name+'」嗎？'))return;
    saveHistory();
    units=units.filter(u=>u.id!==unit.id);
    syncInitiativeOrder();renderAll();scheduleAutosave();
    return;
  }
  // manage toggle
  const mt=e.target.closest('[data-manage-toggle]');
  if(mt){const id=mt.dataset.manageToggle;if(expandedManageIds.has(id))expandedManageIds.delete(id);else expandedManageIds.add(id);const unit=findUnit(id);if(unit)renderUnitsPanel(unit.type);return}
  // custom bar adjust
  const barAdj=e.target.closest('[data-bar-adjust]');
  if(barAdj){
    const wrap=barAdj.closest('[data-bar-id]');const unit=findUnit(wrap.dataset.unitId);const bar=(unit.bars||[]).find(b=>b.id===wrap.dataset.barId);
    if(unit&&bar){const amt=clamp(Number(wrap.querySelector('[data-bar-amount]').value)||1,1,999999);saveHistory();
      bar.value=clamp(bar.value+(barAdj.dataset.barAdjust==='1'?amt:-amt),0,bar.maxValue);renderUnitsPanel(unit.type);scheduleAutosave()}
    return;
  }
  const barDel=e.target.closest('[data-bar-delete]');
  if(barDel){const wrap=barDel.closest('[data-bar-id]');const unit=findUnit(wrap.dataset.unitId);if(unit){saveHistory();unit.bars=unit.bars.filter(b=>b.id!==wrap.dataset.barId);renderUnitsPanel(unit.type);scheduleAutosave()}return}
  // status +/- /delete
  const stTurn=e.target.closest('[data-status-turn]');
  if(stTurn){const wrap=stTurn.closest('[data-status-id]');const unit=findUnit(wrap.dataset.unitId);const st=(unit.statuses||[]).find(s=>s.id===wrap.dataset.statusId);
    if(unit&&st){saveHistory();st.turns=clamp(st.turns+Number(stTurn.dataset.statusTurn),0,999);if(st.turns===0)unit.statuses=unit.statuses.filter(s=>s.id!==st.id);renderUnitsPanel(unit.type);scheduleAutosave()}
    return;
  }
  const stDel=e.target.closest('[data-status-delete]');
  if(stDel){const wrap=stDel.closest('[data-status-id]');const unit=findUnit(wrap.dataset.unitId);if(unit){saveHistory();unit.statuses=unit.statuses.filter(s=>s.id!==wrap.dataset.statusId);renderUnitsPanel(unit.type);scheduleAutosave()}return}
  // passive delete
  const pvDel=e.target.closest('[data-passive-delete]');
  if(pvDel){const wrap=pvDel.closest('[data-passive-id]');const unit=findUnit(wrap.dataset.unitId);if(unit){saveHistory();unit.passives=unit.passives.filter(p=>p.id!==wrap.dataset.passiveId);renderUnitsPanel(unit.type);scheduleAutosave()}return}
  // attribute delete
  const atDel=e.target.closest('[data-attr-delete]');
  if(atDel){const wrap=atDel.closest('[data-attr-id]');const unit=findUnit(wrap.dataset.unitId);if(unit){saveHistory();unit.attributes=unit.attributes.filter(a=>a.id!==wrap.dataset.attrId);renderUnitsPanel(unit.type);scheduleAutosave()}return}
  // threshold delete
  const thDel=e.target.closest('[data-threshold-delete]');
  if(thDel){const wrap=thDel.closest('[data-threshold-id]');const unit=findUnit(wrap.dataset.unitId);if(unit){saveHistory();unit.hpThresholds=unit.hpThresholds.filter(t=>t.id!==wrap.dataset.thresholdId);renderUnitsPanel(unit.type);scheduleAutosave()}return}
  // saved-tag quick add (status/attr/passive/bar templates)
  const tagAdd=e.target.closest('.saved-tag[data-status-add],.saved-tag[data-attr-add],.saved-tag[data-passive-add],.saved-tag[data-bar-add]');
  if(tagAdd){
    const unit=findUnit(tagAdd.dataset.unitId);if(!unit)return;
    saveHistory();
    if(tagAdd.dataset.statusAdd){const tpl=statusTemplates.find(t=>t.id===tagAdd.dataset.statusAdd);if(tpl)unit.statuses.push({id:uid(),name:tpl.name,kind:tpl.kind,turns:tpl.turns})}
    if(tagAdd.dataset.attrAdd){const tpl=attributeTemplates.find(t=>t.id===tagAdd.dataset.attrAdd);if(tpl)unit.attributes.push({id:uid(),name:tpl.name,value:'',color:tpl.color})}
    if(tagAdd.dataset.passiveAdd){const tpl=passiveTemplates.find(t=>t.id===tagAdd.dataset.passiveAdd);if(tpl)unit.passives.push({id:uid(),name:tpl.name,color:tpl.color})}
    if(tagAdd.dataset.barAdd){const tpl=barTemplates.find(t=>t.id===tagAdd.dataset.barAdd);if(tpl)unit.bars.push({id:uid(),name:tpl.name,value:tpl.maxValue,maxValue:tpl.maxValue,color:tpl.color})}
    renderUnitsPanel(unit.type);scheduleAutosave();
    return;
  }
  // mini palette on attribute/bar forms
  const mini=e.target.closest('[data-mini-color]');
  if(mini){const input=mini.closest('.inline-form').querySelector('input[type=color]');if(input)input.value=mini.dataset.miniColor;return}
  // monster remember / duplicate / boss reset
  const remember=e.target.closest('[data-monster-remember]');
  if(remember){const unit=findUnit(remember.dataset.monsterRemember);if(unit){pushWithLimit(monsterTemplates,{id:uid(),name:unit.name,maxHp:unit.maxHp,color:unit.color,isBoss:unit.isBoss,passives:unit.passives.map(p=>({...p})),attributes:unit.attributes.map(a=>({...a,value:''})),bars:unit.bars.map(b=>({...b}))},MAX_TEMPLATES);saveMemory('bt_monsterTemplates',monsterTemplates);renderUnitsPanel('monster');toast('已記住怪物設定')}return}
  const dup=e.target.closest('[data-monster-duplicate]');
  if(dup){const unit=findUnit(dup.dataset.monsterDuplicate);if(unit){saveHistory();const copy=JSON.parse(JSON.stringify(unit));copy.id=uid();copy.name=unit.name+' (複製)';copy.statuses.forEach(s=>s.id=uid());copy.attributes.forEach(a=>a.id=uid());copy.bars.forEach(b=>b.id=uid());copy.passives.forEach(p=>p.id=uid());copy.hpThresholds.forEach(t=>t.id=uid());units.push(copy);initiativeOrder.push(copy.id);renderUnitsPanel('monster');renderInitiative();scheduleAutosave();toast('已複製')}return}
  const bossReset=e.target.closest('[data-boss-reset]');
  if(bossReset){const unit=findUnit(bossReset.dataset.bossReset);if(unit){saveHistory();unit.hp=unit.maxHp;(unit.hpThresholds||[]).forEach(t=>{if(t.triggered&&t.autoRemove){unit.passives=unit.passives.filter(p=>!(p.auto&&p.name===t.passiveName))}t.triggered=false});renderUnitsPanel('monster');renderInitiative();scheduleAutosave();toast('已重置頭目狀態')}return}
});

/* text/number input changes (name, color, hp, bar values, attribute values) */
document.addEventListener('change',e=>{
  const nameInput=e.target.closest('[data-unit-name]');
  if(nameInput){const unit=findUnit(nameInput.dataset.unitName);if(unit){unit.name=nameInput.value.trim()||unit.name;renderInitiative();renderMore();scheduleAutosave()}return}
  const colorInput=e.target.closest('[data-unit-color]');
  if(colorInput){const unit=findUnit(colorInput.dataset.unitColor);if(unit){unit.color=sanitizeColor(colorInput.value,unit.color);renderUnitsPanel(unit.type);renderInitiative();scheduleAutosave()}return}
  const hpCur=e.target.closest('[data-hp-current]');
  if(hpCur){const unit=findUnit(hpCur.dataset.hpCurrent);if(unit){saveHistory();unit.hp=clamp(Number(hpCur.value)||0,0,unit.maxHp);checkHpThresholds(unit);renderUnitsPanel(unit.type);renderInitiative();scheduleAutosave()}return}
  const hpMax=e.target.closest('[data-hp-max]');
  if(hpMax){const unit=findUnit(hpMax.dataset.hpMax);if(unit){saveHistory();unit.maxHp=clamp(Number(hpMax.value)||1,1,999999);unit.hp=Math.min(unit.hp,unit.maxHp);renderUnitsPanel(unit.type);renderInitiative();scheduleAutosave()}return}
  const barVal=e.target.closest('[data-bar-value]');
  if(barVal){const wrap=barVal.closest('[data-bar-id]');const unit=findUnit(wrap.dataset.unitId);const bar=unit&&unit.bars.find(b=>b.id===wrap.dataset.barId);if(bar){saveHistory();bar.value=clamp(Number(barVal.value)||0,0,bar.maxValue);renderUnitsPanel(unit.type);scheduleAutosave()}return}
  const barMax=e.target.closest('[data-bar-max]');
  if(barMax){const wrap=barMax.closest('[data-bar-id]');const unit=findUnit(wrap.dataset.unitId);const bar=unit&&unit.bars.find(b=>b.id===wrap.dataset.barId);if(bar){saveHistory();bar.maxValue=clamp(Number(barMax.value)||1,1,999999);bar.value=Math.min(bar.value,bar.maxValue);renderUnitsPanel(unit.type);scheduleAutosave()}return}
  const attrVal=e.target.closest('[data-attr-value]');
  if(attrVal){const wrap=attrVal.closest('[data-attr-id]');const unit=findUnit(wrap.dataset.unitId);const attr=unit&&unit.attributes.find(a=>a.id===wrap.dataset.attrId);if(attr){attr.value=attrVal.value.slice(0,20);scheduleAutosave()}return}
});

/* forms inside manage panel: status / attribute / passive / bar / threshold */
document.addEventListener('submit',e=>{
  const statusForm=e.target.closest('[data-status-form]');
  if(statusForm){e.preventDefault();const unit=findUnit(statusForm.dataset.statusForm);if(!unit)return;
    const data=new FormData(statusForm);const name=String(data.get('statusName')||'').trim();const kind=data.get('statusKind')==='buff'?'buff':'debuff';const turns=clamp(Number(data.get('statusTurns'))||1,1,999);
    if(!name)return;saveHistory();unit.statuses.push({id:uid(),name,kind,turns});
    if(!statusTemplates.some(t=>t.name===name))pushWithLimit(statusTemplates,{id:uid(),name,kind,turns},MAX_TEMPLATES);
    saveMemory('bt_statusTemplates',statusTemplates);renderUnitsPanel(unit.type);scheduleAutosave();return;
  }
  const attrForm=e.target.closest('[data-attr-form]');
  if(attrForm){e.preventDefault();const unit=findUnit(attrForm.dataset.attrForm);if(!unit)return;
    const data=new FormData(attrForm);const name=String(data.get('attrName')||'').trim();const color=sanitizeColor(data.get('attrColor'),'#4c78a4');
    if(!name)return;saveHistory();unit.attributes.push({id:uid(),name,value:'',color});
    if(!attributeTemplates.some(t=>t.name===name))pushWithLimit(attributeTemplates,{id:uid(),name,color},MAX_TEMPLATES);
    saveMemory('bt_attributeTemplates',attributeTemplates);renderUnitsPanel(unit.type);scheduleAutosave();return;
  }
  const passiveForm=e.target.closest('[data-passive-form]');
  if(passiveForm){e.preventDefault();const unit=findUnit(passiveForm.dataset.passiveForm);if(!unit)return;
    const data=new FormData(passiveForm);const name=String(data.get('passiveName')||'').trim();
    if(!name)return;saveHistory();unit.passives.push({id:uid(),name,color:''});
    if(!passiveTemplates.some(t=>t.name===name))pushWithLimit(passiveTemplates,{id:uid(),name,color:''},MAX_TEMPLATES);
    saveMemory('bt_passiveTemplates',passiveTemplates);renderUnitsPanel(unit.type);scheduleAutosave();return;
  }
  const barForm=e.target.closest('[data-bar-form]');
  if(barForm){e.preventDefault();const unit=findUnit(barForm.dataset.barForm);if(!unit)return;
    const data=new FormData(barForm);const name=String(data.get('barName')||'').trim();const max=clamp(Number(data.get('barMax'))||1,1,999999);const color=sanitizeColor(data.get('barColor'),'#7c8db5');
    if(!name)return;saveHistory();unit.bars.push({id:uid(),name,value:max,maxValue:max,color});
    if(!barTemplates.some(t=>t.name===name))pushWithLimit(barTemplates,{id:uid(),name,maxValue:max,color},MAX_TEMPLATES);
    saveMemory('bt_barTemplates',barTemplates);renderUnitsPanel(unit.type);scheduleAutosave();return;
  }
  const threshForm=e.target.closest('[data-threshold-form]');
  if(threshForm){e.preventDefault();const unit=findUnit(threshForm.dataset.thresholdForm);if(!unit)return;
    if((unit.hpThresholds||[]).length>=5){toast('每個頭目最多可設定5條警戒線');return}
    const data=new FormData(threshForm);const value=Number(data.get('thresholdValue'));const passiveName=String(data.get('thresholdPassive')||'').trim();const autoRemove=data.get('thresholdAuto')==='on';
    if(!Number.isFinite(value)||value<1)return;saveHistory();
    unit.hpThresholds.push({id:uid(),value,passiveName,autoRemove,triggered:false});
    unit.hpThresholds.sort((a,b)=>b.value-a.value);
    checkHpThresholds(unit);renderUnitsPanel(unit.type);scheduleAutosave();return;
  }
});
document.body.addEventListener('submit',e=>{if(e.target.id!=='addPlayerForm'&&e.target.id!=='addMonsterForm'&&e.target.id!=='saveForm'&&e.target.id!=='tagForm')return});

/* service worker (only works when served over http/https, not file://) */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
